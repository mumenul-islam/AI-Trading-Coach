<script>
    // Direct export URL with dynamic timestamp to force Google to serve fresh data on every load
    const SHEET_ID = '2PACX-1vTE8cIWj7R35cpEMXXnYB9NLMqmyAD0EhSk3k_cXpe7W6JeCGYPj6-5UBtpTz_qd3JDHRofB4f9TwQH';
    const GID = '1057997053';
    
    // Bypass browser cache with dynamic query parameter
    const DIRECT_CSV_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID}&single=true&output=csv&t=${Date.now()}`;
    const PROXY_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(DIRECT_CSV_URL);

    function parseCSV(text) {
      let lines = text.split(/\r?\n/);
      return lines.map(line => line.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim()));
    }

    async function loadFeeds() {
      try {
        const response = await fetch(PROXY_URL);
        if (!response.ok) throw new Error('Network response failed');
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        rows.forEach(row => {
          const content = row.join(' ').toLowerCase();

          // Search for Topstep Live Balance
          if (content.includes('topstep')) {
            row.forEach(cell => {
              let num = parseFloat(cell.replace(/[\$,]/g, ''));
              if (!isNaN(num) && num > 500 && num < 10000) {
                document.getElementById('topstep-bal').innerText = '$' + num.toLocaleString('en-US', {minimumFractionDigits: 2});
                let pct = Math.min(Math.max(((num - 998) / (2250 - 998)) * 100, 0), 100).toFixed(1);
                document.getElementById('topstep-pct').innerText = pct + '%';
                document.getElementById('topstep-bar').style.width = pct + '%';
              }
            });
          }

          // Search for Tradeify Balances
          if (content.includes('tradeify')) {
            let nums = [];
            row.forEach(cell => {
              let num = parseFloat(cell.replace(/[\$,]/g, ''));
              if (!isNaN(num) && num > 40000) nums.push(num);
            });
            if (nums.length >= 1) {
              document.getElementById('tdfy1-bal').innerText = '$' + nums[0].toLocaleString('en-US', {minimumFractionDigits: 2});
              let pct = Math.min(Math.max(((nums[0] - 50100) / (54000 - 50100)) * 100, 0), 100).toFixed(1);
              document.getElementById('tdfy-pct').innerText = pct + '%';
              document.getElementById('tdfy-bar').style.width = pct + '%';
            }
            if (nums.length >= 2) {
              document.getElementById('tdfy2-bal').innerText = '$' + nums[1].toLocaleString('en-US', {minimumFractionDigits: 2});
              let cushion = (nums[1] - 50100).toFixed(2);
              document.getElementById('acct2-banner-cushion').innerText = '$' + parseFloat(cushion).toLocaleString('en-US', {minimumFractionDigits: 2});
              document.getElementById('acct2-banner-val').innerText = '$' + parseFloat(cushion).toLocaleString('en-US', {minimumFractionDigits: 2});
            }
          }
        });

        document.getElementById('sync-time').innerText = 'Last Synced with Google Sheets: ' + new Date().toLocaleTimeString();
        document.getElementById('live-indicator').innerText = 'LIVE SHEET SYNCED';
      } catch (e) {
        document.getElementById('sync-time').innerText = 'Sync Active (Baseline Fallback)';
        document.getElementById('live-indicator').innerText = 'STANDBY';
      }
    }

    function calculateCopier() {
      const masterSize = parseInt(document.getElementById('masterSize').value);
      
      let acct1Size = masterSize;
      let acct2Size = masterSize === 4 ? 2 : (masterSize === 6 ? 2 : masterSize);
      let acct345Size = masterSize;

      document.getElementById('acct1-size').innerText = acct1Size + " MNQ";
      document.getElementById('acct1-risk').innerText = "$" + (acct1Size * 50) + " - $" + (acct1Size * 70);

      document.getElementById('acct2-size').innerText = acct2Size + " MNQ (Cap)";
      document.getElementById('acct2-risk').innerText = "$" + (acct2Size * 50) + " - $" + (acct2Size * 70);

      document.getElementById('acct345-size').innerText = acct345Size + " MNQ";
      document.getElementById('acct345-risk').innerText = "$" + (acct345Size * 50) + " - $" + (acct345Size * 70);
    }

    function generatePrompt() {
      const pnl = document.getElementById('pnl').value || '0';
      const tradeCount = document.getElementById('tradeCount').value || '0';
      const rules = document.getElementById('rulesFollowed').value;

      const text = `End of Day Check-In:\n- Today's Net P&L: $${pnl}\n- Total Trades Taken: ${tradeCount}\n- Execution Status: ${rules}\n- Account 2 Status: Capital protected.\n\nPlease review my execution against my prop firm rules and provide coaching feedback.`;

      navigator.clipboard.writeText(text);
      alert('Check-in prompt copied to clipboard! Paste it directly into our coaching chat.');
    }

    loadFeeds();
  </script>
